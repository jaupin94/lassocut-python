[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lassocut"
dynamic = ["version"]
description = "Official Python client for the LassoCut background-removal API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JAUPIN Design LLC" }]
keywords = ["lassocut", "background-removal", "remove-background", "background-remover", "image-processing", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://www.lassocut.com/"
Documentation = "https://www.lassocut.com/docs/"
Source = "https://github.com/jaupin94/lassocut-python"
Issues = "https://github.com/jaupin94/lassocut-python/issues"

[tool.hatch.version]
path = "src/lassocut/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lassocut"]

[tool.hatch.build.targets.sdist]
include = ["src/lassocut", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
